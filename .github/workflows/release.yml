name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            rust_target: ""
          - platform: windows
            os: windows-latest
            args: --bundles nsis
            rust_target: ""
          - platform: macos-arm
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_target: aarch64-apple-darwin
          - platform: macos-intel
            os: macos-13
            args: --target x86_64-apple-darwin --bundles dmg
            rust_target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add extra Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libssl-dev \
            rpm \
            file

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          ELY_OAUTH_CLIENT_ID: ${{ secrets.ELY_OAUTH_CLIENT_ID }}
          ELY_OAUTH_CLIENT_SECRET: ${{ secrets.ELY_OAUTH_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: HorizonUI Launcher ${{ github.ref_name }}
          releaseBody: ""
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Pack Windows portable zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "main") {
            $version = "0.1.0"
          }
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" |
            Where-Object { $_.Name -match 'horizonui' -and $_.Name -notmatch 'uninst' } |
            Select-Object -First 1
          if (-not $exe) {
            throw "Windows executable not found in src-tauri/target/release"
          }
          $stage = "portable/HorizonUI Launcher"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName (Join-Path $stage "HorizonUI Launcher.exe")
          $zip = "HorizonUI-Launcher_${version}_x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          echo "PORTABLE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload Windows portable
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.PORTABLE_ZIP }}" --clobber
