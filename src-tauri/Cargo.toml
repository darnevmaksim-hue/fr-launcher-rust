[package]
name = "horizonui_launcher"
version = "0.1.0"
description = "Minecraft launcher for HorizonUI"
authors = ["nokarin"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "horizonui_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "native-tls", "stream", "blocking"], default-features = false }
futures-util = "0.3"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
zip = "2"
sha1_smol = "1"
hex = "0.4"
md5 = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
